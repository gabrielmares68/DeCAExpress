<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activando tu suscripción · DeCA Express</title><style>body{font:16px/1.5 system-ui;color:#13203a;max-width:600px;margin:14vh auto;padding:24px}p{color:#637087}a{color:#1b3a6b}progress{width:100%;height:12px}</style></head><body><h1>Confirmando tu suscripción…</h1><p>Estamos esperando la confirmación segura de Stripe. Esta página se actualizará automáticamente.</p><progress></progress><p id="status" aria-live="polite"></p><script>const status=document.querySelector('#status');let tries=0;async function check(){try{const r=await fetch('/api/me');if(r.ok){const user=await r.json();if(user.active){location.replace('/app');return}}}catch{}if(++tries>24){status.innerHTML='La confirmación puede tardar un poco. <a href="/">Volver e iniciar sesión</a> para comprobar el estado.';return}setTimeout(check,2500)}check();</script></body></html>
